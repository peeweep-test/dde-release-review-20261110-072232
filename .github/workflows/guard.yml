name: Member guard review
run-name: guard-${{ inputs.probe_id }}-failure-${{ inputs.inject_failure }}
on:
  workflow_dispatch:
    inputs:
      probe_id: {type: string, required: true}
      pr: {type: string, required: true}
      inject_failure: {type: boolean, required: true, default: false}
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GUARD_PR: ${{ inputs.pr }}
      INJECT_FAILURE: ${{ inputs.inject_failure }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - run: pip install --quiet pyyaml
      - name: Exercise original guard shell with real gh
        run: python3 review_runner.py guard
